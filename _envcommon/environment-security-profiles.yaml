schema_version: 1
profiles:
  development:
    gke_release_channel: RAPID
    regional_control_plane: false
    vpc_sc_mode: enforce
  staging:
    gke_release_channel: REGULAR
    regional_control_plane: true
    vpc_sc_mode: dry-run
  production:
    gke_release_channel: STABLE
    regional_control_plane: true
    vpc_sc_mode: dry-run
constraints:
  public_control_plane_cidr: forbidden
  default_network: forbidden
  static_service_account_keys: forbidden
  workload_identity: required
