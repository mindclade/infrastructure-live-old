name: drift

on:
  schedule:
    - cron: "19 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-infrastructure-live
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.9"
  TF_IN_AUTOMATION: "true"
  TG_NON_INTERACTIVE: "true"
  TG_STRICT_MODE: "true"
  GCP_ORG_ID: ${{ vars.GCP_ORG_ID }}
  BILLING_ACCOUNT: ${{ vars.BILLING_ACCOUNT }}
  CLOUD_IDENTITY_CUSTOMER_ID: ${{ vars.CLOUD_IDENTITY_CUSTOMER_ID }}
  ORG_POLICY_ACTIVATION_PHASE: ${{ vars.ORG_POLICY_ACTIVATION_PHASE }}
  BOOTSTRAP_SEED_PROJECT_ID: ${{ vars.BOOTSTRAP_SEED_PROJECT_ID }}
  BOOTSTRAP_CICD_PROJECT_ID: ${{ vars.BOOTSTRAP_CICD_PROJECT_ID }}
  BOOTSTRAP_CICD_PROJECT_NUMBER: ${{ vars.BOOTSTRAP_CICD_PROJECT_NUMBER }}
  GITHUB_WIF_POOL_NAME: ${{ vars.WIF_POOL_GITHUB_NAME }}
  WIF_PROVIDER_SIGNER: ${{ vars.WIF_PROVIDER_SIGNER }}
  ARTIFACT_SIGNER_PRINCIPAL: ${{ vars.ARTIFACT_SIGNER_PRINCIPAL }}
  ARTIFACT_SIGNER_JOB_WORKFLOW_REF: ${{ vars.ARTIFACT_SIGNER_JOB_WORKFLOW_REF }}
  ARTIFACT_RELEASE_IDENTITIES_JSON: ${{ vars.ARTIFACT_RELEASE_IDENTITIES_JSON }}
  DR_EVIDENCE_IDENTITY_JSON: ${{ vars.DR_EVIDENCE_IDENTITY_JSON }}
  BAZEL_CACHE_IDENTITY_JSON: ${{ vars.BAZEL_CACHE_IDENTITY_JSON }}
  PRODUCTION_QUALIFICATION_IDENTITY_JSON: ${{ vars.PRODUCTION_QUALIFICATION_IDENTITY_JSON }}
  TFSTATE_BUCKET_DEVELOPMENT: ${{ vars.TFSTATE_BUCKET_DEVELOPMENT }}
  TFSTATE_BUCKET_STAGING: ${{ vars.TFSTATE_BUCKET_STAGING }}
  TFSTATE_BUCKET_PRODUCTION: ${{ vars.TFSTATE_BUCKET_PRODUCTION }}
  RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
  RESIDENCY_PROFILE: ${{ vars.RESIDENCY_PROFILE || 'us-only-v1' }}
  PRIMARY_REGION: ${{ vars.PRIMARY_REGION }}
  GPU_ZONE: ${{ vars.GPU_ZONE || 'us-central1-b' }}
  DR_REGION: ${{ vars.DR_REGION || 'us-east4' }}
  DR_GPU_ZONE: ${{ vars.DR_GPU_ZONE || 'us-east4-b' }}
  STATE_LOCATION: ${{ vars.STATE_LOCATION }}
  DOMAIN: ${{ vars.DOMAIN }}
  MONOREPO_ORG: ${{ vars.MONOREPO_ORG }}
  SA_TF_LIVE_PLAN: ${{ vars.SA_TF_LIVE_PLAN }}
  SA_TF_LIVE_APPLY_FOUNDATION: ${{ vars.SA_TF_LIVE_APPLY_FOUNDATION }}
  SA_TF_LIVE_APPLY_DEVELOPMENT: ${{ vars.SA_TF_LIVE_APPLY_DEVELOPMENT }}
  SA_TF_LIVE_APPLY_STAGING: ${{ vars.SA_TF_LIVE_APPLY_STAGING }}
  SA_TF_LIVE_APPLY_PRODUCTION: ${{ vars.SA_TF_LIVE_APPLY_PRODUCTION }}

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.activation.outputs.enabled }}
    steps:
      - id: activation
        name: Check connected-drift activation
        env:
          CONNECTED_DRIFT_ENABLED: ${{ vars.INFRASTRUCTURE_CONNECTED_DRIFT }}
        run: |
          set -euo pipefail
          if [[ "$CONNECTED_DRIFT_ENABLED" == true ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Connected drift is staged until bootstrap identities and protected variables are applied."
          fi

  drift:
    needs: [readiness]
    if: github.ref == 'refs/heads/main' && needs.readiness.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      detected: ${{ steps.plan.outputs.drift }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate bootstrap-derived account contract
        run: python3 scripts/validate-account.py --runtime
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.SA_TF_LIVE_PLAN }}
      - id: pem
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5  # v2
        with:
          secrets: app_pem:${{ vars.SECRETS_PROJECT_ID }}/github-app-terraform-pem
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ vars.TF_APP_ID }}
          private-key: ${{ steps.pem.outputs.app_pem }}
          owner: ${{ vars.MONOREPO_ORG }}
          repositories: mindclade-internal-monorepo
      - name: Authorize immutable module fetches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - id: plan
        name: Plan every unit with bounded state locking
        run: |
          set -euo pipefail
          : > drift.txt
          set +e
          nix develop .#ci --command terragrunt run --all \
            --provider-cache \
            --non-interactive \
            --queue-exclude-external \
            -- plan -input=false -no-color -lock-timeout=20m -detailed-exitcode 2>&1 | tee drift.txt
          code=${PIPESTATUS[0]}
          set -e
          if grep -qE 'Plan: [0-9]+ to add|[0-9]+ to change|[0-9]+ to destroy|must be replaced' drift.txt; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$code" -ne 0 && "$code" -ne 2 ]]; then
            echo "::error::drift plan failed with exit code $code"
            exit "$code"
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        if: always()
        with:
          name: drift-output-${{ github.run_id }}
          path: drift.txt
          retention-days: 1
          if-no-files-found: error

  report:
    needs: [readiness, drift]
    if: always() && needs.readiness.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Reconcile drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT_RESULT: ${{ needs.drift.result }}
          DRIFT_DETECTED: ${{ needs.drift.outputs.detected }}
        run: |
          set -euo pipefail
          title='Infrastructure drift detected'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label drift --state open --json number --jq '.[0].number' --limit 1)"

          if [[ "$DRIFT_RESULT" != success ]]; then
            body="## Infrastructure drift scan failed\n\nThe read-only scan did not complete. Run: ${run_url}"
          elif [[ "$DRIFT_DETECTED" == true ]]; then
            body="## Infrastructure drift detected\n\nThe live estate no longer matches Git. Review cloud audit logs before reconciling. The detailed output can contain sensitive resource metadata and is retained for one day as an access-controlled workflow artifact.\n\nRun: ${run_url}"
          else
            if [[ -n "$existing" && "$existing" != null ]]; then
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
            fi
            exit 0
          fi

          if [[ -n "$existing" && "$existing" != null ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label drift --label infrastructure --body "$body"
          fi

  drift-artifact-verify:
    needs: [readiness, drift]
    if: always() && needs.readiness.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download drift artifact for audit
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: drift-output-${{ github.run_id }}
          path: artifacts
      - name: Verify artifact integrity
        run: test -f artifacts/drift.txt
