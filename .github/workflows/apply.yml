name: apply

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Privilege and state scope to apply.
        type: choice
        required: true
        default: development
        options: [foundation, development, staging, production, partners]
      unit:
        description: Optional Terragrunt unit inside the selected scope.
        type: string
        required: false
      allow_destroy:
        description: Explicitly authorize destructive changes in the newly generated saved plan.
        type: boolean
        required: true
        default: false
      change_reference:
        description: Required for destructive work or source rollback (CHG-, INC-, SEC-, or DR-).
        type: string
        required: false
      source_rollback:
        description: Explicitly plan an older reviewed source commit for emergency rollback.
        type: boolean
        required: true
        default: false
      source_rollback_sha:
        description: Full strict-ancestor commit SHA; valid only when source_rollback is true.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: apply-infrastructure-live
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.9"
  TF_IN_AUTOMATION: "true"
  TG_NON_INTERACTIVE: "true"
  TG_STRICT_MODE: "true"
  GCP_ORG_ID: ${{ vars.GCP_ORG_ID }}
  BILLING_ACCOUNT: ${{ vars.BILLING_ACCOUNT }}
  CLOUD_IDENTITY_CUSTOMER_ID: ${{ vars.CLOUD_IDENTITY_CUSTOMER_ID }}
  ORG_POLICY_ACTIVATION_PHASE: ${{ vars.ORG_POLICY_ACTIVATION_PHASE }}
  BOOTSTRAP_SEED_PROJECT_ID: ${{ vars.BOOTSTRAP_SEED_PROJECT_ID }}
  BOOTSTRAP_CICD_PROJECT_ID: ${{ vars.BOOTSTRAP_CICD_PROJECT_ID }}
  BOOTSTRAP_CICD_PROJECT_NUMBER: ${{ vars.BOOTSTRAP_CICD_PROJECT_NUMBER }}
  GITHUB_WIF_POOL_NAME: ${{ vars.WIF_POOL_GITHUB_NAME }}
  WIF_PROVIDER_SIGNER: ${{ vars.WIF_PROVIDER_SIGNER }}
  ARTIFACT_SIGNER_PRINCIPAL: ${{ vars.ARTIFACT_SIGNER_PRINCIPAL }}
  ARTIFACT_SIGNER_JOB_WORKFLOW_REF: ${{ vars.ARTIFACT_SIGNER_JOB_WORKFLOW_REF }}
  ARTIFACT_RELEASE_IDENTITIES_JSON: ${{ vars.ARTIFACT_RELEASE_IDENTITIES_JSON }}
  DR_EVIDENCE_IDENTITY_JSON: ${{ vars.DR_EVIDENCE_IDENTITY_JSON }}
  BAZEL_CACHE_IDENTITY_JSON: ${{ vars.BAZEL_CACHE_IDENTITY_JSON }}
  WORKSTATION_IMAGE_IDENTITY_JSON: ${{ vars.WORKSTATION_IMAGE_IDENTITY_JSON }}
  WORKSTATION_IMAGE_SOURCE_STATE: ${{ vars.WORKSTATION_IMAGE_SOURCE_STATE }}
  WORKSTATION_IMAGE_SOURCE_URI: ${{ vars.WORKSTATION_IMAGE_SOURCE_URI }}
  WORKSTATION_IMAGE_SOURCE_OBJECT_GENERATION: ${{ vars.WORKSTATION_IMAGE_SOURCE_OBJECT_GENERATION }}
  WORKSTATION_IMAGE_SOURCE_SHA256: ${{ vars.WORKSTATION_IMAGE_SOURCE_SHA256 }}
  WORKSTATION_IMAGE_CONTRACT_SHA256: ${{ vars.WORKSTATION_IMAGE_CONTRACT_SHA256 }}
  PRODUCTION_QUALIFICATION_IDENTITY_JSON: ${{ vars.PRODUCTION_QUALIFICATION_IDENTITY_JSON }}
  BOOTSTRAP_ACCOUNT_HANDOFF_JSON: ${{ vars.BOOTSTRAP_ACCOUNT_HANDOFF_JSON }}
  TFSTATE_BUCKET_DEVELOPMENT: ${{ vars.TFSTATE_BUCKET_DEVELOPMENT }}
  TFSTATE_BUCKET_STAGING: ${{ vars.TFSTATE_BUCKET_STAGING }}
  TFSTATE_BUCKET_PRODUCTION: ${{ vars.TFSTATE_BUCKET_PRODUCTION }}
  RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
  RESIDENCY_PROFILE: ${{ vars.RESIDENCY_PROFILE || 'us-only-v1' }}
  PRIMARY_REGION: ${{ vars.PRIMARY_REGION }}
  GPU_ZONE: ${{ vars.GPU_ZONE || 'us-central1-b' }}
  DR_REGION: ${{ vars.DR_REGION || 'us-east4' }}
  DR_GPU_ZONE: ${{ vars.DR_GPU_ZONE || 'us-east4-b' }}
  STATE_LOCATION: ${{ vars.STATE_LOCATION }}
  DOMAIN: ${{ vars.DOMAIN }}
  MONOREPO_ORG: ${{ vars.MONOREPO_ORG }}
  SA_TF_LIVE_PLAN: ${{ vars.SA_TF_LIVE_PLAN }}
  SA_TF_LIVE_APPLY_FOUNDATION: ${{ vars.SA_TF_LIVE_APPLY_FOUNDATION }}
  SA_TF_LIVE_APPLY_DEVELOPMENT: ${{ vars.SA_TF_LIVE_APPLY_DEVELOPMENT }}
  SA_TF_LIVE_APPLY_STAGING: ${{ vars.SA_TF_LIVE_APPLY_STAGING }}
  SA_TF_LIVE_APPLY_PRODUCTION: ${{ vars.SA_TF_LIVE_APPLY_PRODUCTION }}

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.guard.outputs.target_sha }}
      default_head_sha: ${{ steps.guard.outputs.default_head_sha }}
      mode: ${{ steps.guard.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: guard
        name: Resolve current protected source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ROLLBACK: ${{ inputs.source_rollback || false }}
          SOURCE_ROLLBACK_SHA: ${{ inputs.source_rollback_sha || '' }}
          CHANGE_REFERENCE: ${{ inputs.change_reference || '' }}
        run: |
          python3 scripts/validate-protected-run.py source \
            --event-name "$GITHUB_EVENT_NAME" --event-ref "$GITHUB_REF" --event-sha "$GITHUB_SHA" \
            --source-rollback "$SOURCE_ROLLBACK" --source-rollback-sha "$SOURCE_ROLLBACK_SHA" \
            --change-reference "$CHANGE_REFERENCE" --git-root . --github-output "$GITHUB_OUTPUT"

  scope:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - name: Require the protected main branch
        env:
          ACTUAL_REF: ${{ github.ref }}
        run: |
          if [[ "$ACTUAL_REF" != "refs/heads/main" ]]; then
            echo "::error::infrastructure apply may run only from refs/heads/main"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.source.outputs.target_sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_SCOPE: ${{ inputs.scope }}
          UNIT: ${{ inputs.unit }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            matrix="$(./scripts/select-apply-scopes.py --manual-scope "$MANUAL_SCOPE" --unit "$UNIT")"
          else
            matrix="$(./scripts/select-apply-scopes.py --before "$BEFORE" --after "$AFTER")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          jq . <<<"$matrix"

  plan-exact-main:
    needs: [source, scope]
    if: needs.scope.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.source.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate bootstrap-derived account contract
        run: python3 scripts/validate-account.py --runtime
      - name: Check out current guard implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .protected-run-control
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate protected source before plan authentication
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.source.outputs.target_sha }}
          DEFAULT_HEAD_SHA: ${{ needs.source.outputs.default_head_sha }}
          MODE: ${{ needs.source.outputs.mode }}
          SOURCE_ROLLBACK: ${{ inputs.source_rollback || false }}
          SOURCE_ROLLBACK_SHA: ${{ inputs.source_rollback_sha || '' }}
          CHANGE_REFERENCE: ${{ inputs.change_reference || '' }}
        run: |
          python3 .protected-run-control/scripts/validate-protected-run.py check-source \
            --event-name "$GITHUB_EVENT_NAME" --event-ref "$GITHUB_REF" --event-sha "$GITHUB_SHA" \
            --source-rollback "$SOURCE_ROLLBACK" --source-rollback-sha "$SOURCE_ROLLBACK_SHA" \
            --change-reference "$CHANGE_REFERENCE" --git-root .protected-run-control \
            --expected-target-sha "$TARGET_SHA" --expected-default-head-sha "$DEFAULT_HEAD_SHA" \
            --expected-mode "$MODE"
          mv .protected-run-control "$RUNNER_TEMP/protected-run-control"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.SA_TF_LIVE_PLAN }}
      - id: pem
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5  # v2
        with:
          secrets: app_pem:${{ vars.SECRETS_PROJECT_ID }}/github-app-terraform-pem
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ vars.TF_APP_ID }}
          private-key: ${{ steps.pem.outputs.app_pem }}
          owner: ${{ vars.MONOREPO_ORG }}
          repositories: mindclade-internal-monorepo
      - name: Check out module source for interface preflight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mindclade/mindclade-internal-monorepo
          token: ${{ steps.app-token.outputs.token }}
          path: .module-source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate exact module interfaces
        run: python3 scripts/validate-module-interfaces.py --monorepo .module-source
      - name: Authorize immutable module fetches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Save exact plans for merged SHA
        env:
          SCOPE: ${{ matrix.scope }}
          UNIT: ${{ matrix.unit }}
          PLAN_DIR: ${{ runner.temp }}/plans/${{ matrix.scope }}
          TARGET_SHA: ${{ needs.source.outputs.target_sha }}
          DEFAULT_HEAD_SHA: ${{ needs.source.outputs.default_head_sha }}
          MODE: ${{ needs.source.outputs.mode }}
        run: |
          python3 scripts/terragrunt-scope.py plan "$SCOPE" "$PLAN_DIR" "$UNIT"
          python3 "$RUNNER_TEMP/protected-run-control/scripts/validate-protected-run.py" record-plan \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --event-sha "$GITHUB_SHA" --target-sha "$TARGET_SHA" \
            --default-head-sha "$DEFAULT_HEAD_SHA" --mode "$MODE" \
            --output "$PLAN_DIR/protected-run.json"
          (cd "$PLAN_DIR" && sha256sum protected-run.json > protected-run.sha256)
          python3 "$RUNNER_TEMP/protected-run-control/scripts/validate-protected-run.py" bind-plan \
            --bundle "$PLAN_DIR"
      - name: Summarize classified changes
        env:
          PLAN_DIR: ${{ runner.temp }}/plans/${{ matrix.scope }}
        run: jq . "$PLAN_DIR/PLAN_CLASSIFICATION.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: tfplan-${{ needs.source.outputs.target_sha }}-${{ matrix.scope }}
          path: ${{ runner.temp }}/plans/${{ matrix.scope }}
          retention-days: 1
          if-no-files-found: error

  apply:
    needs: [source, scope, plan-exact-main]
    if: needs.scope.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.source.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate bootstrap-derived account contract
        run: python3 scripts/validate-account.py --runtime
      - name: Check out current guard implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .protected-run-control
          fetch-depth: 0
          persist-credentials: false
      - name: Stage current guard outside the target tree
        run: mv .protected-run-control "$RUNNER_TEMP/protected-run-control"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: tfplan-${{ needs.source.outputs.target_sha }}-${{ matrix.scope }}
          path: ${{ runner.temp }}/plans/${{ matrix.scope }}
      - name: Verify plan integrity, freshness, and provenance before authentication
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_DIR: ${{ runner.temp }}/plans/${{ matrix.scope }}
          TARGET_SHA: ${{ needs.source.outputs.target_sha }}
          DEFAULT_HEAD_SHA: ${{ needs.source.outputs.default_head_sha }}
          MODE: ${{ needs.source.outputs.mode }}
          SOURCE_ROLLBACK: ${{ inputs.source_rollback || false }}
          SOURCE_ROLLBACK_SHA: ${{ inputs.source_rollback_sha || '' }}
          CHANGE_REFERENCE: ${{ inputs.change_reference || '' }}
        run: |
          (cd "$PLAN_DIR" && sha256sum --check protected-run.sha256)
          python3 "$RUNNER_TEMP/protected-run-control/scripts/validate-protected-run.py" verify-plan \
            --bundle "$PLAN_DIR"
          python3 "$RUNNER_TEMP/protected-run-control/scripts/validate-protected-run.py" validate-plan \
            --metadata "$PLAN_DIR/protected-run.json" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --event-name "$GITHUB_EVENT_NAME" --event-ref "$GITHUB_REF" --event-sha "$GITHUB_SHA" \
            --source-rollback "$SOURCE_ROLLBACK" --source-rollback-sha "$SOURCE_ROLLBACK_SHA" \
            --change-reference "$CHANGE_REFERENCE" --git-root "$RUNNER_TEMP/protected-run-control" \
            --expected-target-sha "$TARGET_SHA" --expected-default-head-sha "$DEFAULT_HEAD_SHA" \
            --expected-mode "$MODE"
      - name: Enforce destructive-change authorization
        env:
          PLAN_DIR: ${{ runner.temp }}/plans/${{ matrix.scope }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
        run: |
          python3 scripts/authorize-destructive-plan.py \
            "$PLAN_DIR/PLAN_CLASSIFICATION.json" \
            --event-name "$EVENT_NAME" \
            --allow-destroy "${ALLOW_DESTROY:-false}" \
            --change-reference "${CHANGE_REFERENCE:-}"
      - id: identity
        env:
          SCOPE: ${{ matrix.scope }}
          FOUNDATION: ${{ vars.SA_TF_LIVE_APPLY_FOUNDATION }}
          DEVELOPMENT: ${{ vars.SA_TF_LIVE_APPLY_DEVELOPMENT }}
          STAGING: ${{ vars.SA_TF_LIVE_APPLY_STAGING }}
          PRODUCTION: ${{ vars.SA_TF_LIVE_APPLY_PRODUCTION }}
        run: |
          set -euo pipefail
          case "$SCOPE" in
            foundation) value="$FOUNDATION" ;;
            development) value="$DEVELOPMENT" ;;
            staging) value="$STAGING" ;;
            production|partners) value="$PRODUCTION" ;;
            *) exit 2 ;;
          esac
          [[ -n "$value" ]] || { echo "::error::apply service account for $SCOPE is unset"; exit 1; }
          echo "service-account=$value" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_APPLY }}
          service_account: ${{ steps.identity.outputs.service-account }}
      - id: pem
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5  # v2
        with:
          secrets: app_pem:${{ vars.SECRETS_PROJECT_ID }}/github-app-terraform-pem
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ vars.TF_APP_ID }}
          private-key: ${{ steps.pem.outputs.app_pem }}
          owner: ${{ vars.MONOREPO_ORG }}
          repositories: mindclade-internal-monorepo
      - name: Authorize immutable module fetches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Revalidate protected plan and apply exact plans
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_DIR: ${{ runner.temp }}/plans/${{ matrix.scope }}
          TARGET_SHA: ${{ needs.source.outputs.target_sha }}
          DEFAULT_HEAD_SHA: ${{ needs.source.outputs.default_head_sha }}
          MODE: ${{ needs.source.outputs.mode }}
          SOURCE_ROLLBACK: ${{ inputs.source_rollback || false }}
          SOURCE_ROLLBACK_SHA: ${{ inputs.source_rollback_sha || '' }}
          CHANGE_REFERENCE: ${{ inputs.change_reference || '' }}
          SCOPE: ${{ matrix.scope }}
          UNIT: ${{ matrix.unit }}
        run: |
          python3 "$RUNNER_TEMP/protected-run-control/scripts/validate-protected-run.py" validate-plan \
            --metadata "$PLAN_DIR/protected-run.json" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --event-name "$GITHUB_EVENT_NAME" --event-ref "$GITHUB_REF" --event-sha "$GITHUB_SHA" \
            --source-rollback "$SOURCE_ROLLBACK" --source-rollback-sha "$SOURCE_ROLLBACK_SHA" \
            --change-reference "$CHANGE_REFERENCE" --git-root "$RUNNER_TEMP/protected-run-control" \
            --expected-target-sha "$TARGET_SHA" --expected-default-head-sha "$DEFAULT_HEAD_SHA" \
            --expected-mode "$MODE"
          python3 scripts/terragrunt-scope.py apply "$SCOPE" "$PLAN_DIR" "$UNIT"

  report-failure:
    needs: [scope, plan-exact-main, apply]
    if: ${{ always() && needs.scope.outputs.count != '0' && (needs.plan-exact-main.result == 'failure' || needs.apply.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update infrastructure incident
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.scope.outputs.matrix }}
          PLAN_RESULT: ${{ needs.plan-exact-main.result }}
          APPLY_RESULT: ${{ needs.apply.result }}
        run: |
          set -euo pipefail
          marker='infrastructure apply pipeline failed'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Plan result: ${PLAN_RESULT}\nApply result: ${APPLY_RESULT}\nScopes: ${MATRIX}\nRun: ${run_url}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$marker in:title" --json number --jq '.[0].number' --limit 1)"
          if [[ -n "$existing" && "$existing" != null ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$marker" \
              --label incident --label infrastructure \
              --body "$body"
          fi
