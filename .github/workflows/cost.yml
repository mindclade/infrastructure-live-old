# Cost diff on every pull request and merge-queue candidate. The cloud-facing estimator
# cannot mutate the pull request; a separate PR-only job publishes the already-produced diff.
name: cost

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: cost-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.9"
  TF_IN_AUTOMATION: "true"
  TG_NON_INTERACTIVE: "true"
  TG_STRICT_MODE: "true"
  GCP_ORG_ID: ${{ vars.GCP_ORG_ID }}
  BILLING_ACCOUNT: ${{ vars.BILLING_ACCOUNT }}
  CLOUD_IDENTITY_CUSTOMER_ID: ${{ vars.CLOUD_IDENTITY_CUSTOMER_ID }}
  ORG_POLICY_ACTIVATION_PHASE: ${{ vars.ORG_POLICY_ACTIVATION_PHASE }}
  BOOTSTRAP_SEED_PROJECT_ID: ${{ vars.BOOTSTRAP_SEED_PROJECT_ID }}
  BOOTSTRAP_CICD_PROJECT_ID: ${{ vars.BOOTSTRAP_CICD_PROJECT_ID }}
  BOOTSTRAP_CICD_PROJECT_NUMBER: ${{ vars.BOOTSTRAP_CICD_PROJECT_NUMBER }}
  GITHUB_WIF_POOL_NAME: ${{ vars.WIF_POOL_GITHUB_NAME }}
  WIF_PROVIDER_SIGNER: ${{ vars.WIF_PROVIDER_SIGNER }}
  ARTIFACT_SIGNER_PRINCIPAL: ${{ vars.ARTIFACT_SIGNER_PRINCIPAL }}
  ARTIFACT_SIGNER_JOB_WORKFLOW_REF: ${{ vars.ARTIFACT_SIGNER_JOB_WORKFLOW_REF }}
  ARTIFACT_RELEASE_IDENTITIES_JSON: ${{ vars.ARTIFACT_RELEASE_IDENTITIES_JSON }}
  DR_EVIDENCE_IDENTITY_JSON: ${{ vars.DR_EVIDENCE_IDENTITY_JSON }}
  BAZEL_CACHE_IDENTITY_JSON: ${{ vars.BAZEL_CACHE_IDENTITY_JSON }}
  WORKSTATION_IMAGE_IDENTITY_JSON: ${{ vars.WORKSTATION_IMAGE_IDENTITY_JSON }}
  WORKSTATION_IMAGE_SOURCE_STATE: ${{ vars.WORKSTATION_IMAGE_SOURCE_STATE }}
  WORKSTATION_IMAGE_SOURCE_URI: ${{ vars.WORKSTATION_IMAGE_SOURCE_URI }}
  WORKSTATION_IMAGE_SOURCE_OBJECT_GENERATION: ${{ vars.WORKSTATION_IMAGE_SOURCE_OBJECT_GENERATION }}
  WORKSTATION_IMAGE_SOURCE_SHA256: ${{ vars.WORKSTATION_IMAGE_SOURCE_SHA256 }}
  WORKSTATION_IMAGE_CONTRACT_SHA256: ${{ vars.WORKSTATION_IMAGE_CONTRACT_SHA256 }}
  PRODUCTION_QUALIFICATION_IDENTITY_JSON: ${{ vars.PRODUCTION_QUALIFICATION_IDENTITY_JSON }}
  BOOTSTRAP_ACCOUNT_HANDOFF_JSON: ${{ vars.BOOTSTRAP_ACCOUNT_HANDOFF_JSON }}
  TFSTATE_BUCKET_DEVELOPMENT: ${{ vars.TFSTATE_BUCKET_DEVELOPMENT }}
  TFSTATE_BUCKET_STAGING: ${{ vars.TFSTATE_BUCKET_STAGING }}
  TFSTATE_BUCKET_PRODUCTION: ${{ vars.TFSTATE_BUCKET_PRODUCTION }}
  RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
  RESIDENCY_PROFILE: ${{ vars.RESIDENCY_PROFILE || 'us-only-v1' }}
  PRIMARY_REGION: ${{ vars.PRIMARY_REGION }}
  GPU_ZONE: ${{ vars.GPU_ZONE || 'us-central1-b' }}
  DR_REGION: ${{ vars.DR_REGION || 'us-east4' }}
  DR_GPU_ZONE: ${{ vars.DR_GPU_ZONE || 'us-east4-b' }}
  STATE_LOCATION: ${{ vars.STATE_LOCATION }}
  DOMAIN: ${{ vars.DOMAIN }}
  MONOREPO_ORG: ${{ vars.MONOREPO_ORG }}
  SA_TF_LIVE_PLAN: ${{ vars.SA_TF_LIVE_PLAN }}
  SA_TF_LIVE_APPLY_FOUNDATION: ${{ vars.SA_TF_LIVE_APPLY_FOUNDATION }}
  SA_TF_LIVE_APPLY_DEVELOPMENT: ${{ vars.SA_TF_LIVE_APPLY_DEVELOPMENT }}
  SA_TF_LIVE_APPLY_STAGING: ${{ vars.SA_TF_LIVE_APPLY_STAGING }}
  SA_TF_LIVE_APPLY_PRODUCTION: ${{ vars.SA_TF_LIVE_APPLY_PRODUCTION }}

jobs:
  infracost:
    if: >-
      ${{ github.event_name == 'merge_group' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Match the bootstrap plan identity's exact environment-shaped subject. Fork pull
    # requests remain excluded before an OIDC token can be requested.
    environment: plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate bootstrap-derived account contract
        run: python3 scripts/validate-account.py --runtime
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.SA_TF_LIVE_PLAN }}
      - id: pem
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5  # v2
        with:
          secrets: app_pem:${{ vars.SECRETS_PROJECT_ID }}/github-app-terraform-pem
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ vars.TF_APP_ID }}
          private-key: ${{ steps.pem.outputs.app_pem }}
          owner: ${{ vars.MONOREPO_ORG }}
          repositories: mindclade-internal-monorepo
      - name: Authorize immutable module fetches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832  # v3
        with:
          # Third-party pricing-only credential, scoped as a repository secret. This job has
          # read-only cloud identity and no GitHub mutation permission.
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - id: baseline
        name: Resolve exact event baseline
        run: |
          set -euo pipefail
          baseline_sha="$(python3 scripts/resolve_infracost_base.py)"
          git cat-file -e "${baseline_sha}^{commit}"
          if ! git merge-base --is-ancestor "$baseline_sha" HEAD; then
            echo "::error::The event baseline is not an ancestor of the checked-out candidate."
            exit 1
          fi
          printf 'sha=%s\n' "$baseline_sha" >> "$GITHUB_OUTPUT"
      - name: Calculate exact baseline
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          baseline_root="$(mktemp -d)"
          baseline_directory="${baseline_root}/checkout"
          cleanup() {
            set +e
            git worktree remove --force "$baseline_directory" >/dev/null 2>&1
            rm -rf "$baseline_root"
          }
          trap cleanup EXIT

          git worktree add --detach "$baseline_directory" "$BASE_SHA"
          (
            cd "$baseline_directory"
            nix develop .#ci --command infracost breakdown \
              --path=. \
              --format=json \
              --out-file=/tmp/base.json
          )
          test -s /tmp/base.json
          jq . /tmp/base.json >/dev/null
      - name: Calculate cost diff
        run: |
          set -euo pipefail
          nix develop .#ci --command infracost diff \
            --path=. \
            --compare-to=/tmp/base.json \
            --format=json \
            --out-file=/tmp/diff.json
          jq . /tmp/diff.json >/dev/null
      - name: Flag a large increase
        run: |
          set -euo pipefail
          delta="$(jq -r '.diffTotalMonthlyCost // "0"' /tmp/diff.json)"
          echo "Monthly delta: ${delta}"
          if awk -v d="$delta" 'BEGIN { exit !(d+0 > 5000) }'; then
            echo "::warning::This PR increases estimated monthly cost by \$${delta}. Confirm this is intended."
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: infracost-diff-${{ github.run_id }}
          path: /tmp/diff.json
          retention-days: 14
          if-no-files-found: error

  comment:
    needs: [infracost]
    if: ${{ always() && github.event_name == 'pull_request' && needs.infracost.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download cost evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: infracost-diff-${{ github.run_id }}
          path: artifacts
      - uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832  # v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Publish cost comment
        env:
          INFRACOST_GITHUB_TOKEN: ${{ github.token }}
          INFRACOST_PULL_REQUEST: ${{ github.event.pull_request.number }}
          INFRACOST_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          infracost comment github \
            --path=artifacts/diff.json \
            --repo="${INFRACOST_REPOSITORY}" \
            --pull-request="${INFRACOST_PULL_REQUEST}" \
            --github-token="${INFRACOST_GITHUB_TOKEN}" \
            --behavior=update

  verdict:
    name: infracost / verdict
    needs: [infracost]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require a successful cost estimate
        env:
          INFRACOST_RESULT: ${{ needs.infracost.result }}
        run: |
          set -euo pipefail
          if [[ "$INFRACOST_RESULT" != "success" ]]; then
            echo "::error::Infracost did not complete successfully (${INFRACOST_RESULT})."
            exit 1
          fi
