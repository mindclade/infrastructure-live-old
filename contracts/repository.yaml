---
schema_version: 1
repository: infrastructure-live
repository_class: production-control
visibility: private
github:
    enterprise_url: https://github.com/enterprises/mindclade
    organization_url: https://github.com/mindclade
    repository_index_url: https://github.com/orgs/mindclade/repositories
    repository_url: https://github.com/mindclade/infrastructure-live
authority:
    - normal-gcp-organization-infrastructure
    - folders
    - org-policy
    - environments
    - networks
    - projects
    - gke
    - managed-cloud-services
forbidden_authority:
    - ring0-state-foundation
    - argocd-installation
    - kubernetes-desired-state
    - application-source
required_paths:
    - AGENTS.md
    - README.md
    - CONTRIBUTING.md
    - SECURITY.md
    - SUPPORT.md
    - CODE_OF_CONDUCT.md
    - GOVERNANCE.md
    - CHANGELOG.md
    - LEGAL.md
    - LICENSE
    - NOTICE
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/MINDCLADE_PROPRIETARY_SOURCE_HEADER.txt
    - 1-org
    - 2-environments/development
    - 2-environments/staging
    - 2-environments/production
    - 3-networks
    - 4-projects
    - 5-workloads/ci
    - 5-workloads/development
    - 5-workloads/staging
    - 5-workloads/production
    - scripts/validate-arc-runner-placement.py
    - tests/test_arc_runner_placement.py
    - root.hcl
forbidden_paths:
    - .terraform
    - .terragrunt-cache
    - 5-workloads/development/argocd
    - 5-workloads/staging/argocd
    - 5-workloads/production/argocd
default_branch: main
change_model: pull-request
production_controls:
    required_reviews: true
    codeowners: true
    merge_queue: true
    immutable_actions: true
    oidc_only_cloud_authentication: true
